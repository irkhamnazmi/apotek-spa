<div class="modal fade" id="modalStokOpname" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Tambah Stok Opname</h5>
        <div class="header-actions">
          <button class="btn btn-success btn-sm mr-2" id="btnSimpan">
            Simpan
          </button>
          <button class="close text-white" data-dismiss="modal">&times;</button>
        </div>
      </div>

      <div class="modal-body">
        <div class="container-fluid">
          <!-- ===================== BARANG ===================== -->
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Barang *</label>
                <select class="form-control" id="idBarang">
                  <option value="">=== Pilih Barang ===</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Stok Barang *</label>
                <input
                  type="text"
                  class="form-control"
                  id="stokBarang"
                  readonly
                />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>Lokasi Penyimpanan *</label>
                <select class="form-control" id="idLokasiPenyimpanan">
                  <option value="">=== Pilih Lokasi Penyimpanan ===</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>Stok Rak</label>
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="stokRak"
                  readonly
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-group">
                <label>Input Stok Rak*</label>
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="inputStokRak"
                  data-prev="0"
                />
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-group">
                <label>Kapasitas Rak *</label>
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="kapasitasRak"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
