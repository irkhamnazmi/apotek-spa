<div class="modal fade" id="modalKasir" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <!-- HEADER -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Tambah Pesanan</h5>
        <div class="header-actions ml-auto d-flex">
          <button class="btn btn-success btn-sm mr-2" id="btnSimpan">
            Simpan
          </button>
          <button class="btn btn-info btn-sm mr-2" id="btnPrintStruk">
            <i class="fa fa-print"></i> Cetak
          </button>
          <button class="close text-white" data-dismiss="modal">&times;</button>
        </div>
      </div>

      <!-- BODY -->
      <div class="modal-body">
        <div class="container-fluid">
          <!-- DATA KASIR -->
          <div class="row mb-3">
            <div class="col-md-6 col-sm-12 mb-2" id="struk">
              <label for="no_struk">No Struk *</label>
              <input
                type="text"
                id="no_struk"
                class="form-control"
                placeholder="Diisi oleh sistem"
                readonly
              />
            </div>
            <div class="col-md-6 col-sm-12 mb-2">
              <label for="waktu">Waktu *</label>
              <input type="datetime-local" id="waktu" class="form-control" />
            </div>
            <div class="col-md-6 col-sm-12 mb-2">
              <label for="jenis_pembayaran">Jenis Pembayaran *</label>
              <select id="jenis_pembayaran" class="form-control">
                <option value="">-- Pilih Jenis Pembayaran --</option>
              </select>
            </div>
          </div>

          <hr />

          <!-- INPUT BARANG DARI STOK OPNAME -->
          <div class="card mb-3" id="orderList">
            <div class="card-body">
              <h5 class="card-title">Tambah Barang</h5>
              <div class="row align-items-end">
                <!-- Dropdown Barang -->
                <div class="col-md-4 col-sm-12 mb-2">
                  <label for="barangSelect">Pilih Barang *</label>
                  <select id="barangSelect" class="form-control">
                    <option value="">-- Pilih Barang --</option>
                  </select>
                </div>

                <!-- Qty -->
                <div class="col-md-2 col-sm-6 mb-2">
                  <label for="qtyOrder">Qty *</label>
                  <input
                    type="number"
                    id="qtyOrder"
                    class="form-control"
                    min="1"
                    value="1"
                  />
                </div>

                <!-- Jumlah Harga -->
                <div class="col-md-3 col-sm-6 mb-2">
                  <label for="hargaOrder">Jumlah Harga</label>
                  <input
                    type="number"
                    id="hargaOrder"
                    class="form-control"
                    readonly
                  />
                </div>

                <!-- Tombol Tambah -->
                <div class="col-md-3 col-sm-12 mb-2">
                  <button class="btn btn-primary btn-block" id="btnTambahOrder">
                    Tambah ke Daftar
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- TABEL ORDER -->
          <div class="table-responsive">
            <h5>Daftar Pesanan</h5>
            <table class="table table-bordered table-striped" id="tabelOrder">
              <thead class="thead-dark">
                <tr>
                  <th style="width: 5%">No</th>
                  <th>Nama Barang</th>
                  <th style="width: 10%">Qty</th>
                  <th style="width: 15%">Jumlah Harga</th>
                  <th style="width: 10%">#</th>
                </tr>
              </thead>
              <tbody id="bodyOrder"></tbody>
            </table>
          </div>

          <!-- INPUT TOTAL, BAYAR, KEMBALI -->
          <div class="row mt-3">
            <div class="col-md-4 col-sm-12 mb-2">
              <label for="total">Total *</label>
              <input type="number" id="total" class="form-control" readonly />
            </div>
            <div class="col-md-4 col-sm-12 mb-2">
              <label for="bayar">Bayar *</label>
              <input type="number" id="bayar" class="form-control" />
            </div>
            <div class="col-md-4 col-sm-12 mb-2">
              <label for="kembali">Kembali *</label>
              <input type="number" id="kembali" class="form-control" readonly />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
