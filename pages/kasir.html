<!-- Begin Page Content -->
<div class="container-fluid">
  <!-- Page Heading -->
  <h1 class="h3 mb-2 text-gray-800">Kasir</h1>
  <p class="mb-4"><a target="_blank" href="https://datatables.net"></a>.</p>

  <!-- DataTales Example -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <div class="row align-items-center">
        <!-- Dari Tanggal -->
        <div class="col-12 col-md-6 mb-3 mb-md-0">
          <label class="small font-weight-bold d-block mb-2"
            >Dari Tanggal</label
          >
          <div class="row">
            <div class="col-12 col-sm-6 mb-2 mb-sm-0">
              <input
                type="date"
                id="tglAwal"
                class="form-control"
                placeholder="Tanggal Awal"
              />
            </div>
            <div class="col-12 col-sm-6">
              <input
                type="date"
                id="tglAkhir"
                class="form-control"
                placeholder="Tanggal Akhir"
              />
            </div>
          </div>
        </div>

        <!-- Tombol Cetak & Tambah -->
        <div
          class="col-12 col-md-6 d-flex justify-content-md-end justify-content-start align-items-center"
        >
          <button
            class="btn btn-info btn-sm mr-2 mb-2 mb-md-0"
            data-toggle="tooltip"
            data-placement="top"
            title="Cetak data Barang"
            id="btnPrint"
          >
            <i class="fa fa-print"></i>
          </button>
          <button
            class="btn btn-primary btn-sm mb-2 mb-md-0"
            data-toggle="tooltip"
            data-placement="top"
            title="Tambah data Barang"
            id="btnTambah"
          >
            <i class="fa fa-plus"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="small font-weight-bold">Tampilan Item</label>
            <select id="customLength" class="form-control">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>

          <div class="col-md-5"></div>

          <div class="col-md-4">
            <label class="small font-weight-bold"></label>
            <input
              type="text"
              id="customSearch"
              class="form-control"
              placeholder="Cari Satuan..."
            />
          </div>
        </div>
        <table
          class="table table-bordered"
          id="dataTable"
          width="100%"
          cellspacing="0"
        >
          <thead>
            <tr>
              <th>No Struk</th>
              <th>Petugas</th>
              <th>Waktu</th>
              <th>Total</th>
              <th>Jenis Pembayaran</th>
              <th>Bayar</th>
              <th>Kembali</th>

              <th>#</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="modalContainer"></div>
<div id="modalProgressContainer"></div>
