<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>PalmiraFit - Login</title>

    <!-- Custom fonts for this template-->
    <link rel="shortcut icon" href="img/logo_lite.png" type="image/x-icon" />
    <link
      href="vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />

    <!-- Custom LOGIN Styles -->
    <style>
      /* Logo besar di sebelah kiri (desktop) */
      .login-logo-box {
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        padding: 30px;
      }

      .login-logo-box img {
        width: 70%;
        max-width: 250px;
        height: auto;
        filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.1));
      }

      /* Logo mobile (muncul di atas form) */
      .login-logo-mobile img {
        width: 60%;
        max-width: 200px;
      }

      /* Sembunyikan logo kiri di mobile */
      @media (max-width: 992px) {
        .login-logo-box {
          display: none !important;
        }
      }
    </style>
  </head>

  <body class="bg-gradient-primary">
    <div class="container">
      <!-- Outer Row -->
      <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
          <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
              <div class="row">
                <!-- Logo kiri (desktop) -->
                <div class="col-lg-6 d-none d-lg-flex login-logo-box">
                  <img src="img/logo.png" alt="Logo PalmiraFit" />
                </div>

                <!-- Kolom kanan: form login -->
                <div class="col-lg-6">
                  <div class="p-5">
                    <!-- Logo mobile di atas title -->
                    <div class="login-logo-mobile text-center mb-4 d-lg-none">
                      <img
                        src="img/logo.png"
                        alt="PalmiraFit Logo"
                        class="img-fluid"
                      />
                    </div>

                    <div class="text-center">
                      <h1 class="h4 text-gray-900 mb-4">Selamat Datang</h1>
                    </div>

                    <form class="user">
                      <div class="form-group">
                        <input
                          type="email"
                          class="form-control form-control-user"
                          id="exampleInputEmail"
                          placeholder="Enter Email Address..."
                        />
                      </div>
                      <div class="form-group">
                        <input
                          type="password"
                          class="form-control form-control-user"
                          id="exampleInputPassword"
                          placeholder="Password"
                        />
                      </div>

                      <a
                        href="index.html"
                        class="btn btn-primary btn-user btn-block"
                      >
                        Login
                      </a>
                    </form>
                  </div>
                </div>
                <!-- END RIGHT COLUMN -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>
  </body>
</html>
