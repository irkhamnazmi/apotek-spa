<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Struk Pembayaran</title>

    <script src="../vendor/jquery/jquery.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
      }

      body {
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .receipt {
        width: 300px;
        background: white;
        padding: 15px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }

      .receipt-header {
        text-align: center;
        border-bottom: 1px dashed #333;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }

      .receipt-title {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 0px;
      }

      .receipt-date {
        font-size: 12px;
      }

      .receipt-content {
        font-size: 12px;
        line-height: 1.4;
      }

      .receipt-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      .label {
        font-weight: bold;
      }

      .divider {
        border-bottom: 1px dashed #333;
        margin: 10px 0;
      }

      .amount-section {
        margin: 10px 0;
      }

      .total {
        font-weight: bold;
        font-size: 14px;
      }

      .button-container {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      button {
        padding: 8px 15px;
        border: 1px solid #333;
        background: white;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
      }

      button:hover {
        background: #f0f0f0;
      }

      @media print {
        body {
          background: white;
        }

        .receipt {
          box-shadow: none;
        }

        .button-container {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="receipt">
      <div class="receipt-header">
        <div class="receipt-title">
          <img
            src="../img/logostruk.png"
            class="logo-lg d-lg-block"
            alt="Logo"
            height="45"
          />
        </div>
        <div class="receipt-date" id="strukTanggal">--</div>
        <div>STRUK PEMBAYARAN</div>
      </div>

      <div class="receipt-content">
        <div class="content-container">
          <!-- Data akan diisi lewat JS -->
        </div>
      </div>

      <div class="button-container">
        <button id="print-btn">Cetak Struk</button>
        <button id="close-btn">Tutup</button>
      </div>
    </div>

    <script>
      const host = `http://localhost:8081/palmirafit`;
      function getQueryParam(key) {
        const url = new URL(window.location.href);
        return url.searchParams.get(key);
      }

      const id_kasir = getQueryParam("id_kasir");

      $(document).ready(function () {
        if (!id_kasir) {
          alert("ID Kasir tidak ditemukan!");
          return;
        }

        // ================= AJAX: Ambil Data Struk ==================
        $.get(`${host}/api/kasir`, { id_kasir }, function (res) {
          if (!res || !res.meta || res.meta.code !== 200) {
            alert("Gagal memuat struk!" + rest.status);
            return;
          }

          const kasir = res.data.kasir;
          const order = res.data.order;

          $("#strukTanggal").text(kasir.waktu);

          // ================= isi konten struk ==================
          let html = `
            <div class="receipt-row">
                <div class="label">NO STRUK</div>
                <div>${kasir.no_struk}</div>
            </div>

            <div class="receipt-row">
                <div class="label">TANGGAL</div>
                <div>${kasir.waktu}</div>
            </div>

            <div class="divider"></div>

            <div class="label">DAFTAR BARANG</div>
          `;

          order.forEach((o) => {
            html += `
              <div class="receipt-row">
                <div>${o.nama_barang} x${o.qty}</div>
                <div>Rp ${o.subtotal}</div>
              </div>
            `;
          });

          html += `
            <div class="divider"></div>

            <div class="receipt-row total">
                <div>TOTAL</div>
                <div>Rp ${parseInt(kasir.total)}</div>
            </div>

            <div class="receipt-row">
                <div>BAYAR (${kasir.nama_jenis_pembayaran})</div>
                <div>Rp ${parseInt(kasir.bayar)}</div>
            </div>

            <div class="receipt-row">
                <div>KEMBALI</div>
                <div>Rp ${parseInt(kasir.kembali)}</div>
            </div>

            <div class="divider"></div>
            <div class="text-center">TERIMA KASIH</div>
          `;

          $(".content-container").html(html);
        });

        // Tombol print
        $("#print-btn").click(function () {
          window.print();
        });

        // Tutup window
        $("#close-btn").click(function () {
          window.close();
        });
      });
    </script>
  </body>
</html>
